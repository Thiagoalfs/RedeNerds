<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todas as Novidades</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/logo.webp">
    <link rel="stylesheet" href="mais.css">
    <link rel="stylesheet" href="../common/footer.css">
    <link rel="stylesheet" href="../common/navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../common/common.css">
</head>
<body>
    <nav>
        <a href="../index.html"><img id="navbar-img" src="../assets/images/logo.webp"></a>
        <ul id="navbar">
            <li><a href="../index.html#servers-section"><i class="fa-solid fa-server"></i> Servidores</a></li>
            <li><a href="../regras/regras.html"><i class="fa-solid fa-scale-balanced"></i> Regras</a></li>
            <li><a href="../equipe/equipe.html"><i class="fa-solid fa-users"></i> Equipe</a></li>
            <li><a href="../download/download.html"><i class="fa-solid fa-download"></i> Downloads</a></li>
            <li><a href="novidades.html"><i class="fa-solid fa-newspaper"></i> Novidades</a></li>
            <li><a href="../informacoes/suporte.html"><i class="fa-solid fa-life-ring"></i> Suporte</a></li>
        </ul>
        <button id="navbar-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="navbar">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
    </nav>
        <main id="container">
            <a href="novidades.html" id="voltar">
                <i class="fa-solid fa-arrow-left"></i> Voltar para Novidades
            </a>

            <!-- Barra de pesquisa + filtro por categoria -->
            <div id="news-controls">
                <div class="news-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass news-search-icon"></i>
                    <input
                        type="search"
                        id="news-search"
                        class="news-search-input"
                        placeholder="Buscar por título, autor ou conteúdo..."
                        autocomplete="off"
                    >
                    <button type="button" id="news-search-clear" class="news-search-clear" aria-label="Limpar busca">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="news-filter-wrapper">
                    <button type="button" id="news-filter-btn" class="news-filter-btn" aria-haspopup="true" aria-expanded="false">
                        <i class="fa-solid fa-filter"></i>
                        <span id="news-filter-label">Todas</span>
                        <i class="fa-solid fa-chevron-down news-filter-chevron"></i>
                    </button>
                    <ul id="news-filter-dropdown" class="news-filter-dropdown" role="menu" hidden>
                        <li role="menuitem" data-category="all" aria-selected="true">
                            <span class="filter-dot filter-dot-all"></span>
                            Todas
                        </li>
                        <li role="menuitem" data-category="NerdSky">
                            <span class="filter-dot filter-dot-nerdsky"></span>
                            NerdSky
                        </li>
                        <li role="menuitem" data-category="Potato Nerd">
                            <span class="filter-dot filter-dot-potato"></span>
                            Potato Nerd
                        </li>
                        <li role="menuitem" data-category="NerdDead">
                            <span class="filter-dot filter-dot-nerddead"></span>
                            Nerd Dead
                        </li>
                    </ul>
                </div>
            </div>

            <div id="news-results-info" class="news-results-info" hidden>
                <span id="news-results-count">0</span> resultado(s) encontrado(s)
            </div>

            <section id="all-news-container"></section>
        </main>
    </div>

    <div id="footer">
        <p class="footer-text">© Copyright 2026 <span class="bold">Rede Nerds</span>. Todos os direitos reservados.</p>
    </div>

    <script src="../common/navbar.js"></script>
    <script src="js/novidades-data.js"></script>
    <script src="js/mais.js"></script>
</body>
</html>
