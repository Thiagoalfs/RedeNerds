<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizações - Rede Nerds</title>

    <meta name="description" content="Fique por dentro de todas as atualizações, notas de patch e anúncios dos servidores da Rede Nerds.">
    <meta name="keywords" content="atualizações minecraft, atualizações rede nerds, patch notes, noticias minecraft, rede nerds">
    <meta name="author" content="RedeNerds">
    <meta name="robots" content="index, follow">
    <meta http-equiv="refresh" content="0; url=/#atualizacoes-section">
    <script>window.location.replace("/#atualizacoes-section");</script>

    <meta property="og:title" content="Atualizações - Rede Nerds">
    <meta property="og:description" content="Fique por dentro de todas as atualizações e anúncios dos servidores da Rede Nerds.">
    <meta property="og:image" content="https://redenerds.com.br/assets/images/logo.webp">
    <meta property="og:url" content="https://redenerds.com.br/novidades">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Atualizações - Rede Nerds">
    <meta name="twitter:description" content="Fique por dentro de todas as atualizações dos servidores da Rede Nerds.">
    <meta name="twitter:image" content="https://redenerds.com.br/assets/images/logo.webp">

    <link rel="icon" type="image/x-icon" href="/assets/images/logo.webp">
    <link rel="stylesheet" href="/shared/shared.css?v=5">
    <link rel="stylesheet" href="/shared/navbar.css?v=5">
    <link rel="stylesheet" href="/shared/footer.css?v=5">
    <link rel="stylesheet" href="novidades.css?v=5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div id="page-wrapper">
        <!-- ================= VIEW 1: NOVIDADES (INICIAL) ================= -->
        <div id="view-novidades">
            <div id="big-header-div">
                <img id="img-fundo" src="/assets/images/fundo.webp" alt="Fundo">
                <div id="big-header-img-content">
                    <img id="img-titulo" src="/assets/images/logonobg.webp" alt="Logo">
                    <div id="big-header-text">
                        <h1>Novidades</h1>
                        <p>Fique por dentro das nossas novidades no servidor! Mods adicionados/removidos, balanceamentos novos, itens banidos/removidos, atualizações e muito mais!</p>
                        <div id="big-header-buttons">
                            <a href="https://discord.gg/tMSTHK4AkA" target="_blank" rel="noopener noreferrer">
                                <button class="discord">
                                    <i class="fa-brands fa-discord"></i> Servidor Oficial
                                </button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <main id="container">
                <section id="servers-section">
                    <div class="centered-content">
                        <h2 class="subtitle">Novidades</h2>
                    </div>
                </section>
                
                <!-- Container das 3 últimas notícias -->
                <section id="news-container"></section>

                <div class="ver-mais-wrapper">
                    <button type="button" id="btn-mostrar-mais" class="ver-mais-btn">
                        Ver todas as novidades <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </main>
        </div>

        <!-- ================= VIEW 2: TODAS AS NOVIDADES (OCULTA INICIALMENTE) ================= -->
        <div id="view-mais" hidden>
            <main id="container">
                <button type="button" id="voltar" style="background:none; border:none; cursor:pointer;">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para Novidades
                </button>

                <!-- Controls: Busca + Filtro por Categoria -->
                <div id="news-controls">
                    <div class="news-search-wrapper">
                        <i class="fa-solid fa-magnifying-glass news-search-icon"></i>
                        <input
                            type="search"
                            id="news-search"
                            class="news-search-input"
                            placeholder="Buscar por título, autor ou conteúdo."
                            autocomplete="off"
                        >
                        <button type="button" id="news-search-clear" class="news-search-clear" aria-label="Limpar busca">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="news-filter-wrapper">
                        <button type="button" id="news-filter-btn" class="news-filter-btn" aria-haspopup="true" aria-expanded="false">
                            <i class="fa-solid fa-filter"></i>
                            <span id="news-filter-label">Todas</span>
                            <i class="fa-solid fa-chevron-down news-filter-chevron"></i>
                        </button>
                        <ul id="news-filter-dropdown" class="news-filter-dropdown" role="menu" hidden>
                            <li role="menuitem" data-category="all" aria-selected="true">
                                <span class="filter-dot filter-dot-all"></span> Todas
                            </li>
                            <li role="menuitem" data-category="NerdSky">
                                <span class="filter-dot filter-dot-nerdsky"></span> NerdSky
                            </li>
                            <li role="menuitem" data-category="Potato Nerd">
                                <span class="filter-dot filter-dot-potato"></span> Potato Nerd
                            </li>
                            <li role="menuitem" data-category="NerdDead">
                                <span class="filter-dot filter-dot-nerddead"></span> Nerd Dead
                            </li>
                        </ul>
                    </div>
                </div>

                <div id="news-results-info" class="news-results-info" hidden>
                    <span id="news-results-count">0</span> resultado(s) encontrado(s)
                </div>

                <!-- Container da lista completa / buscada -->
                <section id="all-news-container"></section>

                <!-- Paginação estilo Google -->
                <nav id="news-pagination" class="news-pagination" hidden aria-label="Paginação de novidades"></nav>
            </main>
        </div>
    </div>

    <div id="footer"></div>

    <script src="/shared/navbar.js?v=1"></script>
    <script src="/shared/copy-ip.js?v=1"></script>
    <script src="/novidades/js/novidades.js?v=1"></script>
</body>
</html>
